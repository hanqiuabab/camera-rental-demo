<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>相机租赁 · 取景 FRAME RENTAL</title>
    <meta name="description" content="取景相机租赁静态展示。浏览示例器材并预览租赁费用。">
    <link rel="stylesheet" href="./assets/storefront.css">
    <link rel="stylesheet" href="./demo.css">
</head>
<body class="storefront-shell">
    <a class="visually-hidden-focusable storefront-skip-link" href="#main-content">跳到主要内容</a>
    <header class="storefront-header">
        <div class="container storefront-header-inner">
            <a class="storefront-brand" href="./index.html">
                <span class="storefront-brand-mark" aria-hidden="true"></span>
                <span class="storefront-brand-copy"><strong>取景</strong><small>FRAME RENTAL</small></span>
            </a>
            <nav class="storefront-nav" aria-label="主导航">
                <a href="#equipment">器材列表</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="storefront-main">
        <section class="catalog-hero" aria-labelledby="catalog-title">
            <div class="container catalog-hero-inner">
                <div class="catalog-hero-copy">
                    <p class="demo-label">静态展示 · 示例数据</p>
                    <h1 id="catalog-title">相机租赁</h1>
                    <p>浏览示例器材，按天预览租赁费用。</p>
                    <a class="btn catalog-hero-cta" href="#equipment">浏览器材</a>
                </div>
            </div>
        </section>

        <section id="equipment" class="container catalog-section" aria-labelledby="equipment-heading">
            <div class="catalog-section-heading">
                <h2 id="equipment-heading">器材列表</h2>
            </div>
            <div class="catalog-grid">
                <article class="card catalog-card">
                    <div class="catalog-card-media">
                        <img src="./assets/cam-01.jpg" alt="练习相机示例图片" width="960" height="640" loading="lazy" decoding="async">
                    </div>
                    <div class="catalog-card-body">
                        <span class="catalog-card-code">CAM-01</span>
                        <h3 class="catalog-card-title">练习相机</h3>
                        <div class="catalog-card-footer">
                            <div class="catalog-price"><strong>¥120.00</strong><small> / 天</small></div>
                            <a class="btn catalog-card-action" href="./reserve.html?sku=CAM-01">选租期<span class="visually-hidden"> · 练习相机</span></a>
                        </div>
                    </div>
                </article>
                <article class="card catalog-card">
                    <div class="catalog-card-media">
                        <img src="./assets/cam-02.jpg" alt="轻便旅行相机示例图片" width="960" height="640" loading="lazy" decoding="async">
                    </div>
                    <div class="catalog-card-body">
                        <span class="catalog-card-code">CAM-02</span>
                        <h3 class="catalog-card-title">轻便旅行相机</h3>
                        <div class="catalog-card-footer">
                            <div class="catalog-price"><strong>¥90.00</strong><small> / 天</small></div>
                            <a class="btn catalog-card-action" href="./reserve.html?sku=CAM-02">选租期<span class="visually-hidden"> · 轻便旅行相机</span></a>
                        </div>
                    </div>
                </article>
                <article class="card catalog-card">
                    <div class="catalog-card-media">
                        <img src="./assets/cam-03.jpg" alt="视频创作相机示例图片" width="960" height="640" loading="lazy" decoding="async">
                    </div>
                    <div class="catalog-card-body">
                        <span class="catalog-card-code">CAM-03</span>
                        <h3 class="catalog-card-title">视频创作相机</h3>
                        <div class="catalog-card-footer">
                            <div class="catalog-price"><strong>¥180.00</strong><small> / 天</small></div>
                            <a class="btn catalog-card-action" href="./reserve.html?sku=CAM-03">选租期<span class="visually-hidden"> · 视频创作相机</span></a>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="storefront-footer">
        <div class="container storefront-footer-inner"><span>取景 FRAME RENTAL</span></div>
    </footer>
</body>
</html>
